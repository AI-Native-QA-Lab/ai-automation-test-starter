[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-api-starter"
version = "0.1.0"
description = "A small, framework-native Pytest API assertion starter."
requires-python = ">=3.10"
dependencies = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
